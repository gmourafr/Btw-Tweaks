<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel — BTW Tweaks</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="img/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rajdhani:wght@500;600;700&family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .admin-wrap { max-width: 920px; margin: 0 auto; padding: 56px 24px; }
  .login-box { max-width: 360px; margin: 80px auto; background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 32px; }

  .admin-topo { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 28px; }
  .admin-contador { font-family: var(--font-mono); font-size: 13px; color: var(--text-faint); }

  .filtros { display: flex; gap: 8px; margin-bottom: 28px; flex-wrap: wrap; }
  .filtro-btn { background: var(--bg-elevated); border: 1px solid var(--border-strong); color: var(--text-muted); border-radius: 999px; padding: 8px 16px; font-size: 13px; font-weight: 600; }
  .filtro-btn:hover { border-color: var(--border-strong); color: var(--text); }
  .filtro-btn.ativo { background: var(--blue-soft); border-color: var(--blue); color: var(--blue); }

  .agendamento-card { background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 24px 26px; margin-bottom: 16px; }

  .card-topo { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }

  .card-quando { font-family: var(--font-display); font-size: 22px; color: var(--text); line-height: 1.2; }
  .card-servico { font-family: var(--font-label); font-weight: 600; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--blue); margin-top: 4px; }

  .status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px; font-family: var(--font-mono); font-size: 12px; font-weight: 500; white-space: nowrap; }
  .status-pill.confirmado { background: var(--blue-soft); color: var(--blue); }
  .status-pill.pendente_pagamento { background: rgba(217, 119, 87, 0.12); color: var(--warn); }
  .status-pill.cancelado, .status-pill.expirado { background: rgba(255,255,255,0.05); color: var(--text-faint); }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  .card-dados { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px 32px; padding: 18px 0; border-top: 1px solid var(--border); }

  .dado-label { font-family: var(--font-label); font-weight: 600; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: #9096a3; margin-bottom: 5px; }
  .dado-valor { font-size: 15px; color: var(--text); }
  .dado-valor.mono { font-family: var(--font-mono); font-size: 14px; }

  .card-observacoes { border-top: 1px solid var(--border); padding-top: 16px; margin-top: 2px; }
  .obs-texto { font-size: 14px; color: var(--text-muted); line-height: 1.6; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; margin-top: 6px; white-space: pre-wrap; }

  .card-acoes { display: flex; justify-content: flex-end; margin-top: 18px; }
  .btn-cancelar { background: none; border: 1px solid var(--border-strong); color: var(--warn); border-radius: var(--radius-sm); padding: 9px 16px; font-size: 13px; font-weight: 600; }
  .btn-cancelar:hover { border-color: var(--warn); background: rgba(217, 119, 87, 0.08); }

  .vazio { color: var(--text-faint); margin-top: 24px; font-size: 15px; }

  @media (max-width: 560px) {
    .card-dados { grid-template-columns: 1fr; }
  }

  /* ---------- Calendario mensal (visao geral) ---------- */

  .mini-calendario { background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 20px 22px; margin-bottom: 28px; }
  .mini-cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .mini-cal-titulo { font-family: var(--font-display); font-size: 17px; color: var(--text); }
  .mini-cal-nav { display: flex; gap: 8px; }
  .mini-cal-semana { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); margin-bottom: 8px; }
  .mini-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .mini-cal-dia { position: relative; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid transparent; background: var(--bg); color: var(--text-muted); font-family: var(--font-mono); font-size: 13px; }
  .mini-cal-dia.vazio-cel { background: none; border: none; }
  .mini-cal-dia:not(.vazio-cel):hover { border-color: var(--border-strong); color: var(--text); }
  .mini-cal-dia.tem-agendamento { color: var(--text); }
  .mini-cal-dia.selecionado { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); }
  .mini-cal-pontos { display: flex; gap: 2px; margin-top: 3px; height: 5px; }
  .mini-cal-ponto { width: 5px; height: 5px; border-radius: 50%; background: var(--blue); }
  .mini-cal-ponto.pendente { background: var(--warn); }
  .mini-cal-limpar { margin-top: 14px; background: none; border: none; color: var(--blue); font-size: 13px; font-weight: 600; padding: 0; }

  /* ---------- Modal de novo agendamento ---------- */

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
  .modal-overlay[hidden] { display: none; }
  .modal-box { background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 32px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
  .modal-topo { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 22px; }
  .modal-fechar { background: none; border: none; color: var(--text-faint); font-size: 22px; line-height: 1; padding: 4px; }
  .modal-fechar:hover { color: var(--text); }
</style>

</head>
<body>

<div class="admin-wrap" id="telaLogin">
  <div class="login-box">
    <p class="eyebrow">Acesso restrito</p>
    <h2 style="font-size:22px;">Painel BTW Tweaks</h2>
    <div class="campo" style="margin-top:20px;">
      <label for="senhaAdmin">Senha</label>
      <input type="password" id="senhaAdmin" placeholder="••••••••">
    </div>
    <button class="btn btn-primary" id="btnEntrar" style="width:100%;">Entrar</button>
    <div class="form-msg" id="loginMsg"></div>
  </div>
</div>

<div class="admin-wrap" id="telaPainel" style="display:none;">
  <div class="admin-topo">
    <div>
      <p class="eyebrow" style="margin-bottom:6px;">Painel</p>
      <h2 style="font-size:28px;">Agendamentos</h2>
    </div>
    <div style="display:flex;align-items:center;gap:16px;">
      <span class="admin-contador" id="contador"></span>
      <button class="btn btn-primary" id="btnNovoAgendamento" style="padding:10px 18px;font-size:14px;">+ Novo agendamento</button>
    </div>
  </div>

  <div class="mini-calendario">
    <div class="mini-cal-header">
      <span class="mini-cal-titulo" id="miniCalTitulo"></span>
      <div class="mini-cal-nav">
        <button type="button" class="date-nav" id="miniCalAnterior" aria-label="Mês anterior">‹</button>
        <button type="button" class="date-nav" id="miniCalProximo" aria-label="Próximo mês">›</button>
      </div>
    </div>
    <div class="mini-cal-semana">
      <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
    </div>
    <div class="mini-cal-grid" id="miniCalGrid"></div>
    <button type="button" class="mini-cal-limpar" id="miniCalLimpar" hidden>Limpar filtro de data</button>
  </div>

  <div class="filtros" id="filtros">
    <button class="filtro-btn ativo" data-filtro="todos">Todos</button>
    <button class="filtro-btn" data-filtro="confirmado">Pagos</button>
    <button class="filtro-btn" data-filtro="pendente_pagamento">Aguardando</button>
    <button class="filtro-btn" data-filtro="cancelado_expirado">Cancelados</button>
  </div>

  <div id="tabelaContainer"></div>
</div>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal-box">
    <div class="modal-topo">
      <div>
        <p class="eyebrow" style="margin-bottom:4px;">Agendamento manual</p>
        <h2 style="font-size:20px;">Novo agendamento</h2>
      </div>
      <button type="button" class="modal-fechar" id="modalFechar" aria-label="Fechar">×</button>
    </div>

    <form id="formNovoAgendamento" novalidate>
      <div class="campo">
        <label for="admServico">Serviço</label>
        <select id="admServico" required>
          <option value="" disabled selected>Carregando serviços...</option>
        </select>
      </div>

      <div class="campo">
        <label for="admDataBtn">Data</label>
        <div class="date-picker">
          <button type="button" class="date-trigger" id="admDataBtn" aria-haspopup="dialog" aria-expanded="false">
            <span id="admDataTexto">Escolha uma data</span>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <rect x="2" y="3" width="12" height="11" rx="2" stroke="currentColor" stroke-width="1.3"/>
              <path d="M2 6.5H14" stroke="currentColor" stroke-width="1.3"/>
              <path d="M5 1.5V4M11 1.5V4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
          </button>
          <div class="date-popover" id="admDatePopover" hidden>
            <div class="date-popover-header">
              <button type="button" class="date-nav" id="admMesAnterior" aria-label="Mês anterior">‹</button>
              <span id="admMesAtualLabel"></span>
              <button type="button" class="date-nav" id="admMesProximo" aria-label="Próximo mês">›</button>
            </div>
            <div class="date-grid-semana">
              <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
            </div>
            <div class="date-grid" id="admDateGrid"></div>
          </div>
        </div>
      </div>

      <div class="campo">
        <label for="admHorarios">Horário</label>
        <div class="slots" id="admSlotsContainer"></div>
        <p class="slots-msg" id="admSlotsMsg">Selecione uma data para ver os horários disponíveis.</p>
      </div>

      <div class="campo">
        <label for="admNome">Nome</label>
        <input type="text" id="admNome" placeholder="Nome do cliente" required>
      </div>

      <div class="campo">
        <label for="admContato">WhatsApp ou Discord</label>
        <input type="text" id="admContato" placeholder="@usuario ou (xx) xxxxx-xxxx" required>
      </div>

      <div class="campo">
        <label for="admObservacoes">Observações (opcional)</label>
        <textarea id="admObservacoes" placeholder="Specs do PC, jogo principal, etc."></textarea>
      </div>

      <button type="submit" class="btn btn-primary" id="admBtnSalvar" style="width:100%;">Criar agendamento</button>

      <div class="form-msg" id="admFormMsg"></div>
    </form>
  </div>
</div>

<script src="js/admin.js"></script>
</body>
</html>
